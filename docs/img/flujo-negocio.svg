<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Flujo de negocio">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475467"/></marker>
  </defs>
  <rect width="1000" height="590" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#101828">Flujo de negocio: de la carga a la cuarentena</text>

  <rect x="30" y="52" width="940" height="62" rx="10" fill="#f4f3ff" stroke="#7a5af8"/>
  <text x="500" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#5925dc">0. Iniciar sesión (usuario y contraseña, token JWT)</text>
  <text x="500" y="96" text-anchor="middle" font-size="11" fill="#344054">Sin sesión no se entra a nada. Cada ingreso, salida, carga y procesado queda en la tabla de auditoría, con lo que entró y lo que salió.</text>
  <path d="M125 114 V146" stroke="#475467" stroke-width="1.5" marker-end="url(#a)"/>

  <g transform="translate(0,76)">

  <rect x="30" y="70" width="190" height="90" rx="10" fill="#eff8ff" stroke="#2e90fa"/>
  <text x="125" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#175cd3">1. Subir archivo</text>
  <text x="125" y="120" text-anchor="middle" font-size="11" fill="#344054">commerce_DDMMYYYY.csv</text>
  <text x="125" y="138" text-anchor="middle" font-size="11" fill="#344054">pantalla Carga</text>

  <rect x="255" y="70" width="190" height="90" rx="10" fill="#eff8ff" stroke="#2e90fa"/>
  <text x="350" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#175cd3">2. Revisión en pantalla</text>
  <text x="350" y="120" text-anchor="middle" font-size="11" fill="#344054">Vista previa y errores</text>
  <text x="350" y="138" text-anchor="middle" font-size="11" fill="#344054">por fila antes de enviar</text>

  <rect x="480" y="70" width="190" height="90" rx="10" fill="#fffaeb" stroke="#f79009"/>
  <text x="575" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b54708">3. Revisión en el API</text>
  <text x="575" y="120" text-anchor="middle" font-size="11" fill="#344054">Estructura, fechas, códigos</text>
  <text x="575" y="138" text-anchor="middle" font-size="11" fill="#344054">y claves repetidas</text>

  <rect x="705" y="70" width="265" height="90" rx="10" fill="#ecfdf3" stroke="#12b76a"/>
  <text x="837" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#067647">4. Guardar en commerce</text>
  <text x="837" y="120" text-anchor="middle" font-size="11" fill="#344054">Todos los registros, en una sola operación</text>
  <text x="837" y="138" text-anchor="middle" font-size="11" fill="#344054">Si la clave ya existe: se rechaza</text>

  <path d="M220 115 H255" stroke="#475467" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M445 115 H480" stroke="#475467" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M670 115 H705" stroke="#475467" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="480" y="215" width="190" height="80" rx="10" fill="#fef3f2" stroke="#f04438"/>
  <text x="575" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#b42318">Archivo rechazado</text>
  <text x="575" y="262" text-anchor="middle" font-size="11" fill="#344054">Mensaje claro con la fila</text>
  <text x="575" y="278" text-anchor="middle" font-size="11" fill="#344054">y el motivo. No se guarda nada</text>
  <path d="M575 160 V215" stroke="#f04438" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="583" y="192" font-size="10" fill="#b42318">con errores</text>
  <path d="M760 160 V255 H670" fill="none" stroke="#f04438" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="768" y="205" font-size="10" fill="#b42318">clave ya cargada</text>

  <path d="M905 160 V260" stroke="#475467" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="913" y="215" font-size="10" fill="#475467">guardado</text>

  <rect x="705" y="260" width="265" height="80" rx="10" fill="#f4f3ff" stroke="#7a5af8"/>
  <text x="837" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#5925dc">5. Procesar una fecha</text>
  <text x="837" y="310" text-anchor="middle" font-size="11" fill="#344054">Se revisa el nombre y el número</text>
  <text x="837" y="326" text-anchor="middle" font-size="11" fill="#344054">de cada registro de esa fecha</text>

  <path d="M870 340 V385 H760 V400" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M870 385 H930 V400" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="610" y="400" width="240" height="95" rx="10" fill="#ecfdf3" stroke="#12b76a"/>
  <text x="730" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#067647">Registros correctos</text>
  <text x="730" y="450" text-anchor="middle" font-size="11" fill="#344054">Se quedan en la tabla commerce</text>
  <text x="730" y="468" text-anchor="middle" font-size="11" fill="#344054">Pantalla Registros</text>

  <rect x="865" y="400" width="120" height="95" rx="10" fill="#fef3f2" stroke="#f04438"/>
  <text x="925" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#b42318">Con error</text>
  <text x="925" y="446" text-anchor="middle" font-size="11" fill="#344054">Pasan a</text>
  <text x="925" y="462" text-anchor="middle" font-size="11" fill="#344054">cuarentena con</text>
  <text x="925" y="478" text-anchor="middle" font-size="11" fill="#344054">su motivo</text>

  <rect x="30" y="400" width="540" height="95" rx="10" fill="#f9fafb" stroke="#d0d5dd"/>
  <text x="300" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#101828">Motivos de cuarentena (se pueden sumar)</text>
  <text x="300" y="452" text-anchor="middle" font-size="12" fill="#344054">El nombre del comercio está vacío</text>
  <text x="300" y="470" text-anchor="middle" font-size="12" fill="#344054">El número de documento está vacío, tiene letras o tiene caracteres especiales</text>
  </g>
</svg>
